name: v2-cpu-contracts

on:
  push:
    paths:
      - "src/**"
      - "pipelines/v2_*.py"
      - "checks/v2_*.py"
      - "configs/v2/**"
      - "requirements.txt"
      - ".github/workflows/v2-cpu-contracts.yml"
  pull_request:
  workflow_dispatch:

jobs:
  contracts:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install contract dependencies
        shell: pwsh
        run: python -m pip install numpy==2.4.6 scipy==1.17.1 scikit-learn==1.9.1 faiss-cpu==1.15.1 psutil==7.2.2
      - name: Compile Version 2.0 modules
        shell: pwsh
        run: python -B -m compileall -q src pipelines checks
      - name: Run CPU contracts
        shell: pwsh
        run: python -B -m checks.v2_ci
